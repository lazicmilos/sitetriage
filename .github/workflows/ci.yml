name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    # Only the offline layer: `live` tests would fail whenever some site's certificate
    # expires, and that is not a bug in the tool.
    # Pinned: Playwright 1.56 has no browser builds for newer Ubuntu; bump together with Playwright and the Docker base image.
    runs-on: ubuntu-24.04
    strategy:
      # A failure on one version does not cancel the others, so it shows whether it is version-specific.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    name: offline (Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e '.[dev]'

      - name: Lint
        run: ruff check sitetriage/ tests/ scripts/

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Tests
        # Exit criterion from the test plan: line and branch coverage does not drop below 95 %.
        run: pytest -q --cov=sitetriage --cov-branch --cov-report=term --cov-fail-under=95

      - name: Check table matches the README
        # The registry does not depend on the Python version, so one run is enough.
        if: matrix.python-version == '3.11'
        run: |
          sitetriage explain --all --markdown > /tmp/registry.md
          while IFS= read -r row; do
            check_id=$(printf '%s' "$row" | cut -d'`' -f2)
            grep -qF "\`$check_id\`" README.md || {
              echo "::error::$check_id is not in the README table (run: sitetriage explain --all --markdown)"
              exit 1
            }
          done < <(tail -n +3 /tmp/registry.md)

  docker:
    # The same environment the real runs use. Without this job the Dockerfile breaks silently
    # the first time the Playwright version in pyproject.toml changes.
    # Pinned: Playwright 1.56 has no browser builds for newer Ubuntu; bump together with Playwright and the Docker base image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker compose build

      - name: Tests in the container
        run: docker compose run --rm --user "$(id -u):$(id -g)" sitetriage pytest -q
