# Release: build the sdist and wheel, publish them to PyPI and push the Docker image to GitHub
# Container Registry (ghcr.io).
#
# Two ways to start it:
# - push a tag `v*` (for example from a GitHub release created in the web UI);
# - run it by hand (Actions → release → Run workflow, or the API) on `main` with the version. The
#   `check` job refuses a version that does not match `sitetriage/__init__.py` and CHANGELOG.md, or
#   whose tag or PyPI release already exists. Once PyPI has accepted the upload, the `tag` job tags
#   the commit the run started from as `v<version>`, and once the image is pushed too, the GitHub
#   release is created. A tag pushed with the workflow's own token does not start another run.
#
# Order: PyPI is the one step that cannot be undone (a version, once uploaded, can never be uploaded
# again), so everything else that is published waits for it. When PyPI refuses the upload, no tag,
# image or release exists, and the same version can be released again from scratch. When a later
# job fails, re-run the failed jobs of that run: PyPI is not touched again.
#
# PyPI publishing uses trusted publishing (OIDC, no API token): it only works after a trusted
# publisher for this repository, this workflow and the `pypi` environment is configured on PyPI.
# Deleting the project on PyPI deletes its trusted publishers too.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (for example 3.0.0); must match sitetriage/__init__.py"
        required: true
        type: string

permissions:
  contents: read

env:
  # On a tag push this is the tag (v3.0.0); docker/metadata-action reads it as semver either way.
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  check:
    if: github.event_name == 'workflow_dispatch'
    # Pinned: Playwright 1.56 has no browser builds for newer Ubuntu; bump together with Playwright and the Docker base image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check the version, the tag and PyPI
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::run the release from main, not $GITHUB_REF"; exit 1
          fi
          if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 3.0.0, got '$INPUT_VERSION'"; exit 1
          fi
          grep -qx "__version__ = \"$INPUT_VERSION\"" sitetriage/__init__.py || {
            echo "::error::sitetriage/__init__.py does not say $INPUT_VERSION"; exit 1; }
          grep -q "^## $INPUT_VERSION " CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no section for $INPUT_VERSION"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$INPUT_VERSION" >/dev/null; then
            echo "::error::tag v$INPUT_VERSION already exists"; exit 1
          fi
          # Only a 404 means the version is free; any other answer stops the release rather than
          # guessing.
          status=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 \
            "https://pypi.org/pypi/sitetriage/$INPUT_VERSION/json")
          case "$status" in
            404) ;;
            200) echo "::error::sitetriage $INPUT_VERSION is already on PyPI"; exit 1 ;;
            *) echo "::error::could not check PyPI for $INPUT_VERSION (HTTP $status)"; exit 1 ;;
          esac

  build:
    needs: check
    # Runs after `check` on a manual run; on a tag push `check` is skipped and this runs anyway.
    if: ${{ !failure() && !cancelled() }}
    # Pinned: Playwright 1.56 has no browser builds for newer Ubuntu; bump together with Playwright and the Docker base image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    if: ${{ !failure() && !cancelled() }}
    # Pinned: Playwright 1.56 has no browser builds for newer Ubuntu; bump together with Playwright and the Docker base image.
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    # After PyPI: an image of a version that is not on PyPI is a release nobody can finish.
    needs: pypi
    if: ${{ !failure() && !cancelled() }}
    # Pinned: Playwright 1.56 has no browser builds for newer Ubuntu; bump together with Playwright and the Docker base image.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
            type=semver,pattern={{major}},value=${{ env.VERSION }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  tag:
    # Only on a manual run, and only after PyPI accepted the upload: on a tag push the tag exists.
    needs: pypi
    if: ${{ github.event_name == 'workflow_dispatch' && !failure() && !cancelled() }}
    # Pinned: Playwright 1.56 has no browser builds for newer Ubuntu; bump together with Playwright and the Docker base image.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # The commit the run started from, which is what `build` built, even if main moved since.
      - uses: actions/checkout@v4

      - name: Tag the released commit
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$INPUT_VERSION" -m "SiteTriage $INPUT_VERSION"
          git push origin "v$INPUT_VERSION"

  github-release:
    # Only on a manual run: a pushed tag usually comes from a release that already exists.
    needs: [tag, docker]
    if: ${{ github.event_name == 'workflow_dispatch' && !failure() && !cancelled() }}
    # Pinned: Playwright 1.56 has no browser builds for newer Ubuntu; bump together with Playwright and the Docker base image.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create the GitHub release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          awk -v v="$INPUT_VERSION" '
            index($0, "## " v " ") == 1 { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
          # Relative links do not resolve in a release body: point them at the tagged tree.
          sed -i "s#](docs/#](https://github.com/$GITHUB_REPOSITORY/blob/v$INPUT_VERSION/docs/#g" notes.md
          gh release create "v$INPUT_VERSION" --verify-tag --title "SiteTriage $INPUT_VERSION" --notes-file notes.md
