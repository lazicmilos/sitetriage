# docker compose run --rm sitetriage <komanda> — vidi docs/provera-na-pravim-sajtovima.md
services:
  sitetriage:
    build: .
    image: sitetriage:dev
    init: true          # Chromium pravi podprocese; bez init-a ostaju zombiji
    shm_size: "1gb"     # podrazumevanih 64 MB /dev/shm obara Chromium na težim stranama
    # Izlaz u ./rad mora da pripada tebi, ne korisniku iz slike. 1000 je prvi nalog na
    # većini Linux-a; ako je tvoj drugačiji: `export SITETRIAGE_UID=$(id -u) SITETRIAGE_GID=$(id -g)`.
    # Docker Desktop (Mac, Windows) ionako mapira vlasništvo.
    user: "${SITETRIAGE_UID:-1000}:${SITETRIAGE_GID:-1000}"
    # Ko skenira — vidi [operator] u sitetriage.toml. Bez ova dva alat odbija da skenira.
    environment:
      - SITETRIAGE_OPERATOR_NAME
      - SITETRIAGE_OPERATOR_CONTACT
    volumes:
      - ./rad:/rad      # ulaz (CSV) i izlaz (izveštaji, snapshoti); kod ostaje u slici
