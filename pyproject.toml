[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sitetriage"
dynamic = ["version"]
description = "Scan a list of domains politely and rank the sites that deserve a full manual audit"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Milos Lazic", email = "miloslazic458@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["website audit", "seo", "accessibility", "performance", "crawler", "lead triage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
# Playwright is pinned: the package expects exactly its own Chromium revision, so an upgrade
# without `playwright install` breaks every browser test (see `chromium_starts` in tests/conftest.py).
dev = ["pytest>=8", "pytest-cov==6.0.0", "playwright==1.56.0", "ruff>=0.6", "jsonschema>=4.18", "pre-commit>=3.5"]

[project.urls]
Homepage = "https://github.com/lazicmilos/sitetriage"
Repository = "https://github.com/lazicmilos/sitetriage"
Issues = "https://github.com/lazicmilos/sitetriage/issues"
Changelog = "https://github.com/lazicmilos/sitetriage/blob/main/CHANGELOG.md"

[project.scripts]
sitetriage = "sitetriage.cli:main"

[tool.setuptools.packages.find]
include = ["sitetriage*"]

# The JSON report schema and the default config ship with the package: integrations and the web
# app validate against the schema, and an installed `sitetriage` reads its defaults from
# sitetriage/sitetriage.toml.
[tool.setuptools.package-data]
sitetriage = ["schema/*.json", "sitetriage.toml"]

[tool.setuptools.dynamic]
version = { attr = "sitetriage.__version__" }


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live' --strict-markers"
markers = [
    "live: a real network run over the list in SITETRIAGE_LIVE_CSV; off by default (pytest -m live)",
    "browser: needs Playwright and Chromium installed; skipped when Chromium does not start",
]

# Mutation testing (docs/sr/plan-testiranja.md): the modules with logic.
# A new module under sitetriage/ is included automatically unless it is in do_not_mutate. That
# is why pure modules (messages, diff, outcomes, address classification) do not go into fetch/*
# or report/*. mutmut 3.2.3 runs the whole test suite; it does not read a test selection from
# the settings. It runs only on Linux, so through Docker:
#   docker compose run --rm sitetriage python scripts/mutation.py
[tool.mutmut]
paths_to_mutate = ["sitetriage/"]
do_not_mutate = [
    "sitetriage/__init__.py", "sitetriage/cli.py", "sitetriage/pipeline.py", "sitetriage/models.py", "sitetriage/store.py",
    "sitetriage/fetch/*", "sitetriage/report/*",
]
also_copy = ["sitetriage/sitetriage.toml", "sitetriage/schema/"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
