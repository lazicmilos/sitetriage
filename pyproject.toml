[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sitetriage"
dynamic = ["version"]
description = "Scan a list of domains politely and rank the sites that deserve a full manual audit"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Milos Lazic", email = "miloslazic458@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["website audit", "seo", "accessibility", "performance", "crawler", "lead triage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
# Playwright je zakucan: paket traži tačno svoju reviziju Chromium-a, pa nadogradnja
# bez `playwright install` obori sve browser testove (vidi `chromium_se_pokrece`).
dev = ["pytest>=8", "pytest-cov==6.0.0", "playwright==1.56.0", "ruff>=0.6", "jsonschema>=4.18", "pre-commit>=3.5"]

[project.urls]
Homepage = "https://github.com/lazicmilos/sitetriage"
Repository = "https://github.com/lazicmilos/sitetriage"
Issues = "https://github.com/lazicmilos/sitetriage/issues"
Changelog = "https://github.com/lazicmilos/sitetriage/blob/main/CHANGELOG.md"

[project.scripts]
sitetriage = "sitetriage.cli:main"

[tool.setuptools.packages.find]
include = ["sitetriage*"]

# The JSON report schema and the default config ship with the package: integrations and the web
# app validate against the schema, and an installed `sitetriage` reads its defaults from
# sitetriage/sitetriage.toml.
[tool.setuptools.package-data]
sitetriage = ["schema/*.json", "sitetriage.toml"]

[tool.setuptools.dynamic]
version = { attr = "sitetriage.__version__" }


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live' --strict-markers"
markers = [
    "live: pravi mrežni prolaz nad listom iz SITETRIAGE_LIVE_CSV; iskljucen po defaultu (pytest -m live)",
    "browser: trazi instaliran Playwright/Chromium; preskace se ako ga nema",
]

# Mutaciono testiranje (docs/plan-testiranja.md): moduli sa logikom.
# Nov modul pod sitetriage/ je obuhvaćen sam, osim ako je u do_not_mutate. Zato čisti
# moduli (poruke, diff, ishodi, klasifikacija adresa) ne idu u fetch/* ni report/*.
# mutmut 3.2.3 pokreće ceo skup testova; izbor testova iz podešavanja ne čita.
# Radi samo na Linux-u, pa kroz Docker:
#   docker compose run --rm sitetriage python scripts/mutacije.py
[tool.mutmut]
paths_to_mutate = ["sitetriage/"]
do_not_mutate = [
    "sitetriage/__init__.py", "sitetriage/cli.py", "sitetriage/pipeline.py", "sitetriage/models.py", "sitetriage/store.py",
    "sitetriage/fetch/*", "sitetriage/report/*",
]
also_copy = ["sitetriage/sitetriage.toml", "sitetriage/schema/"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
